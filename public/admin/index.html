  <link rel="stylesheet" href="/admin/vendor/toastui-editor.min.css">
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #f5f7fa; color: #202b38; }

    #auth-gate { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f5f7fa; }
    #auth-gate form { width: min(360px, 100%); background: #fff; border: 1px solid #dfe4ea; border-radius: 8px; padding: 24px; display: grid; gap: 14px; }
    #auth-gate h1 { margin: 0; font-size: 20px; } #auth-gate label { display: grid; gap: 6px; font-size: 13px; color: #536273; }
    #auth-gate input { width: 100%; border: 1px solid #ccd5de; border-radius: 5px; padding: 9px 10px; }
    #auth-error { min-height: 18px; margin: 0; color: #c83d45; font-size: 13px; }
    * { box-sizing: border-box; } body { margin: 0; min-width: 1040px; min-height: 100vh; } button, input { font: inherit; } button { cursor: pointer; }
    .shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }.nav { position: sticky; top: 0; height: 100vh; background: #fff; border-right: 1px solid #dfe4ea; display: flex; flex-direction: column; }.brand { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid #e6e9ed; font-size: 16px; font-weight: 650; }.brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: #1677ff; color: #fff; }

    .workspace { min-width: 0; }.topbar { height: 58px; background: #fff; border-bottom: 1px solid #dfe4ea; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; position: sticky; top: 0; z-index: 20; }.breadcrumb { display: flex; align-items: center; gap: 8px; color: #84909c; font-size: 13px; }.breadcrumb svg { width: 14px; height: 14px; }.breadcrumb strong { color: #253140; font-weight: 600; }.actions { display: flex; align-items: center; gap: 8px; }.btn { min-height: 34px; border: 1px solid #cfd7df; border-radius: 5px; background: #fff; color: #344354; padding: 7px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }.btn svg { width: 15px; height: 15px; }.btn:hover { border-color: #94a7ba; }.btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; }.btn.danger { color: #c83d45; }.btn.icon { width: 34px; padding: 0; }.btn:disabled { opacity: .5; cursor: not-allowed; }
    .page { display: grid; grid-template-columns: 280px minmax(680px, 1fr); min-height: calc(100vh - 58px); }.post-panel { background: #fff; border-right: 1px solid #dfe4ea; min-height: calc(100vh - 58px); }.panel-head { height: 58px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e6e9ed; }.panel-head h2 { margin: 0; font-size: 15px; }.search-wrap { position: relative; margin: 12px; }.search-wrap svg { position: absolute; left: 10px; top: 10px; width: 15px; height: 15px; color: #8a96a2; } input { width: 100%; border: 1px solid #ccd5de; border-radius: 5px; background: #fff; color: #253140; padding: 8px 10px; } input:focus { outline: 2px solid #cfe3ff; border-color: #1677ff; } #filter { padding-left: 33px; } #post-list { display: grid; gap: 2px; padding: 0 8px 16px; max-height: calc(100vh - 150px); overflow-y: auto; }.post-item { width: 100%; border: 1px solid transparent; border-radius: 5px; background: transparent; padding: 10px; text-align: left; }.post-item:hover { background: #f5f7fa; }.post-item.active { background: #eaf3ff; border-color: #cce2ff; }.post-title { display: flex; align-items: center; gap: 6px; }.post-title strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }.post-title svg { width: 13px; height: 13px; color: #db8a18; flex: none; }.post-item small { display: block; color: #8a96a2; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.empty { padding: 30px 12px; text-align: center; color: #8a96a2; font-size: 13px; }
    .editor-page { min-width: 0; padding: 22px 24px 48px; }.editor-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }.editor-head h1 { margin: 0 0 5px; font-size: 21px; }.editor-head p { margin: 0; color: #84909c; font-size: 12px; }.form-section { background: #fff; border: 1px solid #dfe4ea; border-radius: 6px; margin-bottom: 14px; }.section-title { min-height: 45px; padding: 0 16px; border-bottom: 1px solid #e8ebef; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; }.section-title svg { width: 16px; height: 16px; color: #647688; }.form-body { padding: 16px; }.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; } label.field { display: grid; gap: 6px; color: #536273; font-size: 12px; } label.field.full { grid-column: 1 / -1; }.required { color: #d03b45; }.switches { display: flex; flex-wrap: wrap; gap: 18px 24px; }.check { display: inline-flex; align-items: center; gap: 8px; color: #465667; font-size: 13px; cursor: pointer; }.check input { width: 16px; height: 16px; margin: 0; accent-color: #1677ff; }.encrypt-fields { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #d9dfe5; }.hidden { display: none !important; }.password-wrap { position: relative; }.password-wrap input { padding-right: 40px; }.password-wrap button { position: absolute; top: 1px; right: 1px; width: 36px; height: 32px; padding: 0; border: 0; background: transparent; color: #758493; display: grid; place-items: center; }.password-wrap svg { width: 16px; height: 16px; } #editor { min-height: 560px; }.toastui-editor-defaultUI { border: 0 !important; border-radius: 0 0 6px 6px !important; }.toastui-editor-toolbar { background: #fbfcfd !important; }.toastui-editor-main { min-height: 520px; }.toastui-editor-contents { font-family: "Microsoft YaHei", system-ui, sans-serif; }#status { min-height: 20px; margin: 10px 1px 0; color: #2b7a3f; font-size: 13px; } #status.error { color: #c83d45; }.save-note { color: #87929d; font-size: 12px; }@media (max-width: 1180px) { .shell { grid-template-columns: 190px minmax(0, 1fr); }.page { grid-template-columns: 240px minmax(680px, 1fr); } }
    .module-page { display: none; grid-column: 1 / -1; padding: 22px 24px 48px; }.module-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }.module-header h1 { margin: 0 0 5px; font-size: 21px; }.module-header p { margin: 0; color: #84909c; font-size: 12px; }.module-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; }.module-list { min-height: 420px; }.module-list > div:last-child { padding: 8px; }.module-row { display: block; width: 100%; border: 1px solid transparent; border-radius: 5px; background: transparent; padding: 10px; text-align: left; margin-bottom: 2px; }.module-row:hover { background: #f5f7fa; }.module-row.active { background: #eaf3ff; border-color: #cce2ff; }.module-row strong, .module-row small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.module-row small { color: #8a96a2; margin-top: 5px; }.module-page textarea { width: 100%; border: 1px solid #ccd5de; border-radius: 5px; padding: 8px 10px; resize: vertical; }.module-page select { width: 100%; border: 1px solid #ccd5de; border-radius: 5px; background: #fff; padding: 8px 10px; color: #253140; }
    .album-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 10px; border: 1px solid #e0e6ec; border-radius: 5px; background: #fafbfd; }.album-image { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 5px; background: #e8edf2; }.album-image img { width: 100%; height: 100%; object-fit: cover; display: block; }.album-image-actions { position: absolute; inset: auto 5px 5px 5px; display: flex; gap: 4px; }.album-image-actions button { min-height: 27px; padding: 4px 7px; border: 0; border-radius: 4px; background: rgba(20,30,40,.82); color: #fff; font-size: 11px; }.album-image-actions button.delete-image { background: rgba(180,45,50,.9); }
  </style>
</head>
<body class="auth-locked">
  <div id="auth-gate"><form id="auth-form"><h1>Mizuki 管理后台</h1><label>账号<input id="auth-username" autocomplete="username" required></label><label>密码<input id="auth-password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">登录</button><p id="auth-error"></p></form></div>
  <div class="shell"><aside class="nav"><div class="brand"><span class="brand-mark"><i data-lucide="feather"></i></span>Mizuki 管理台</div><nav class="nav-group"><div class="nav-label">内容</div><button class="nav-item active" data-module="posts"><i data-lucide="file-text"></i><span>文章管理</span></button><button class="nav-item" data-module="diary"><i data-lucide="notebook-pen"></i><span>日记管理</span></button><button class="nav-item" data-module="albums"><i data-lucide="images"></i><span>相册管理</span></button><div class="nav-label">展示</div><button class="nav-item" data-module="projects"><i data-lucide="folder-kanban"></i><span>项目管理</span></button><div class="nav-label">系统</div><button class="nav-item disabled" title="暂未开放"><i data-lucide="settings"></i><span>网站设置</span><i class="lock" data-lucide="lock-keyhole"></i></button></nav><div class="nav-foot">仅本地开发环境可用<br>不会部署到 Cloudflare</div></aside>
  <div class="workspace"><header class="topbar"><div class="breadcrumb"><span>内容管理</span><i data-lucide="chevron-right"></i><strong>文章</strong></div><a class="btn" href="/" target="_blank"><i data-lucide="external-link"></i>查看网站</a></header><main class="page"><aside class="post-panel"><div class="panel-head"><h2>文章列表</h2><button class="btn icon primary" id="new-post" title="新建文章"><i data-lucide="plus"></i></button></div><div class="search-wrap"><i data-lucide="search"></i><input id="filter" placeholder="搜索标题或路径"></div><div id="post-list"></div></aside>
  <article class="editor-page"><div class="editor-head"><div><h1 id="editor-title">新建文章</h1><p id="editor-subtitle">填写文章信息并编辑正文</p></div><div class="actions"><button class="btn danger" id="delete" disabled><i data-lucide="trash-2"></i>删除</button><button class="btn primary" id="save"><i data-lucide="save"></i>保存文章</button></div></div>
  <section class="form-section"><div class="section-title"><i data-lucide="info"></i>基础信息</div><div class="form-body grid"><label class="field">文件路径 <span class="required">*</span><input id="id" placeholder="例如 notes/hello（自动补全 .md）"></label><label class="field">标题 <span class="required">*</span><input id="title" placeholder="文章标题"></label><label class="field">发布日期 <span class="required">*</span><input id="published" type="date"></label><label class="field">更新时间<input id="updated" type="date"></label><label class="field">分类<input id="category" placeholder="例如 随笔"></label><label class="field">标签<input id="tags" placeholder="生活, 技术"></label><label class="field full">摘要<input id="description" placeholder="显示在文章列表中的摘要"></label></div></section>
  <section class="form-section"><div class="section-title"><i data-lucide="pen-line"></i>正文</div><div id="editor"></div></section>
  <section class="form-section"><div class="section-title"><i data-lucide="sliders-horizontal"></i>发布设置</div><div class="form-body switches"><label class="check"><input id="draft" type="checkbox">保存为草稿</label><label class="check"><input id="pinned" type="checkbox">置顶文章</label></div></section>
  <section class="form-section"><div class="section-title"><i data-lucide="shield-check"></i>访问保护</div><div class="form-body"><div class="switches"><label class="check"><input id="encrypted" type="checkbox">启用密码保护</label><label class="check"><input id="hideHomeContent" type="checkbox">隐藏首页文章摘要</label></div><div class="encrypt-fields hidden" id="encrypt-fields"><div class="grid"><label class="field">访问密码 <span class="required">*</span><span class="password-wrap"><input id="password" type="password" autocomplete="new-password" placeholder="读者打开文章时需要输入"><button id="toggle-password" type="button" title="显示或隐藏密码"><i data-lucide="eye"></i></button></span></label><label class="field">密码提示<input id="passwordHint" placeholder="例如：我的生日"></label></div></div></div></section><div class="save-note">保存后若新文章详情页暂时为 404，请重启开发服务器以刷新 Astro 路由。</div><p id="status"></p></article>
  <section class="module-page" id="module-diary"><div class="module-header"><div><h1>日记管理</h1><p>管理网站日记页面中的动态记录。</p></div><div class="actions"><button class="btn danger" id="diary-delete" disabled><i data-lucide="trash-2"></i>删除</button><button class="btn primary" id="diary-save"><i data-lucide="save"></i>保存日记</button></div></div><div class="module-grid"><div class="form-section module-list"><div class="panel-head"><h2>日记列表</h2><button class="btn icon primary" id="diary-new" title="新建日记"><i data-lucide="plus"></i></button></div><div id="diary-list"></div></div><div class="form-section"><div class="section-title"><i data-lucide="notebook-pen"></i>日记内容</div><div class="form-body grid"><label class="field">日期<input id="diary-date" type="datetime-local"></label><label class="field">地点<input id="diary-location" placeholder="例如：杭州"></label><label class="field">心情<input id="diary-mood" placeholder="例如：开心"></label><label class="field">标签<input id="diary-tags" placeholder="生活, 随笔"></label><label class="field full">图片地址<input id="diary-images" placeholder="多个地址用逗号分隔"></label><label class="field full">上传图片到 Cloudinary<input id="diary-upload" type="file" accept="image/*" multiple><small class="save-note">图片会上传到 Cloudinary 的 boke 目录。</small></label><label class="field full">内容 <span class="required">*</span><textarea id="diary-content" rows="9" placeholder="写下今天发生的事情..."></textarea></label></div></div></div></section>
  <section class="module-page" id="module-projects"><div class="module-header"><div><h1>项目管理</h1><p>管理项目展示页中的项目卡片。</p></div><div class="actions"><button class="btn danger" id="project-delete" disabled><i data-lucide="trash-2"></i>删除</button><button class="btn primary" id="project-save"><i data-lucide="save"></i>保存项目</button></div></div><div class="module-grid"><div class="form-section module-list"><div class="panel-head"><h2>项目列表</h2><button class="btn icon primary" id="project-new" title="新建项目"><i data-lucide="plus"></i></button></div><div id="project-list"></div></div><div class="form-section"><div class="section-title"><i data-lucide="folder-kanban"></i>项目信息</div><div class="form-body grid"><label class="field">项目 ID <span class="required">*</span><input id="project-id" placeholder="例如 my-project"></label><label class="field">项目标题 <span class="required">*</span><input id="project-title" placeholder="项目名称"></label><label class="field full">项目描述 <span class="required">*</span><textarea id="project-description" rows="4"></textarea></label><label class="field">分类<select id="project-category"><option value="web">Web</option><option value="mobile">Mobile</option><option value="desktop">Desktop</option><option value="other">其他</option></select></label><label class="field">状态<select id="project-status"><option value="completed">已完成</option><option value="in-progress">进行中</option><option value="planned">计划中</option></select></label><label class="field">开始日期<input id="project-start" type="date"></label><label class="field">结束日期<input id="project-end" type="date"></label><label class="field">技术栈<input id="project-tech" placeholder="Astro, TypeScript"></label><label class="field">标签<input id="project-tags" placeholder="开源, 博客"></label><label class="field">封面图片<input id="project-image" placeholder="/assets/projects/demo.webp"></label><label class="field">演示地址<input id="project-visit"></label><label class="field">源码地址<input id="project-source"></label><label class="check"><input id="project-featured" type="checkbox">精选项目</label></div></div></div></section>
  <section class="module-page" id="module-albums"><div class="module-header"><div><h1>相册管理</h1><p>编辑相册信息；本地模式可直接上传、设置封面和删除照片。</p></div><div class="actions"><button class="btn danger" id="album-delete" disabled><i data-lucide="trash-2"></i>删除</button><button class="btn primary" id="album-save"><i data-lucide="save"></i>保存相册</button></div></div><div class="module-grid"><div class="form-section module-list"><div class="panel-head"><h2>相册列表</h2><button class="btn icon primary" id="album-new" title="新建相册"><i data-lucide="plus"></i></button></div><div id="album-list"></div></div><div class="form-section"><div class="section-title"><i data-lucide="images"></i>相册信息</div><div class="form-body grid"><label class="field">目录 ID <span class="required">*</span><input id="album-id" placeholder="例如 travel-2026"></label><label class="field">标题 <span class="required">*</span><input id="album-title"></label><label class="field full">描述<textarea id="album-description" rows="3"></textarea></label><label class="field">日期<input id="album-date" type="date"></label><label class="field">地点<input id="album-location"></label><label class="field">标签<input id="album-tags" placeholder="旅行, 风景"></label><label class="field">封面地址<input id="album-cover" placeholder="本地相册会自动使用第一张图片"></label><label class="check"><input id="album-external" type="checkbox">使用外链相册</label><label class="check"><input id="album-hidden" type="checkbox">隐藏相册</label><label class="field">密码<input id="album-password" type="password"></label><label class="field">密码提示<input id="album-password-hint"></label><label class="field full">上传本地照片<input id="album-upload" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif" multiple><small class="save-note">先保存相册，再选择照片上传。上传后会显示在下方。</small></label><div class="field full"><span>本地照片</span><div id="album-images" class="album-images"><small class="save-note">选择一个相册后显示照片。</small></div></div><label class="field full">外链照片 JSON（外链模式）<textarea id="album-photos" rows="5" placeholder='[{"src":"https://example.com/photo.jpg","title":"照片"}]'></textarea></label></div></div></div></section>
  </main></div></div>
    <script src="/admin/vendor/lucide.min.js"></script><script src="/admin/vendor/toastui-editor-all.min.js"></script><script src="/admin/vendor/toastui-editor-zh-cn.js"></script>
  <script>
    const $ = (id) => document.getElementById(id); const today = new Date().toISOString().slice(0, 10); let currentId = null; let posts = [];
    async function checkOnlineSession() { try { const response = await fetch("/api/admin/session"); const result = await response.json(); if (result.authenticated) { document.body.classList.remove("auth-locked"); $("auth-gate").remove(); } } catch {} }
    $("auth-form").onsubmit = async (event) => { event.preventDefault(); $("auth-error").textContent = "正在登录..."; try { const response = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("auth-username").value, password: $("auth-password").value }) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || "登录失败"); location.reload(); } catch (error) { $("auth-error").textContent = error.message; } };
    checkOnlineSession();
    lucide.createIcons({ attrs: { "stroke-width": 1.8 } });
    const CLOUDINARY_CLOUD = "wmu4lce4"; const CLOUDINARY_PRESET = "muri10086"; const CLOUDINARY_FOLDER = "boke";
    if (!$("project-upload")) { const input = document.createElement("input"); input.id = "project-upload"; input.type = "file"; input.accept = "image/*"; input.style.marginTop = "6px"; $("project-image")?.parentElement?.appendChild(input); }
    async function uploadToCloudinary(file) { const form = new FormData(); form.append("file", file); form.append("upload_preset", CLOUDINARY_PRESET); form.append("folder", CLOUDINARY_FOLDER); const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`, { method: "POST", body: form }); const result = await response.json(); if (!response.ok || !result.secure_url) throw new Error(result.error?.message || "Cloudinary 上传失败"); return result; }
    const editor = new toastui.Editor({ el: $("editor"), height: "560px", initialEditType: "wysiwyg", previewStyle: "vertical", language: "zh-CN", usageStatistics: false, hideModeSwitch: false, toolbarItems: [["heading", "bold", "italic", "strike"], ["hr", "quote"], ["ul", "ol", "task", "indent", "outdent"], ["table", "image", "link"], ["code", "codeblock"]], hooks: { addImageBlobHook: async (blob, callback) => { try { setStatus("正在上传图片到 Cloudinary..."); const result = await uploadToCloudinary(blob); callback(result.secure_url, blob.name || "文章图片"); setStatus("图片上传成功"); } catch (error) { setStatus(error.message || "图片上传失败", true); } } } });
    function fileToBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(",")[1] || ""); reader.onerror = () => reject(new Error("图片读取失败")); reader.readAsDataURL(file); }); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" })[char]); } function setStatus(message, error = false) { $("status").textContent = message; $("status").className = error ? "error" : ""; } function dateValue(value) { return String(value || "").slice(0, 10); } function updateEncryptionFields() { $("encrypt-fields").classList.toggle("hidden", !$("encrypted").checked); if ($("encrypted").checked) $("hideHomeContent").checked = true; }
    function resetForm() { currentId = null; $("editor-title").textContent = "新建文章"; $("editor-subtitle").textContent = "填写文章信息并编辑正文"; $("delete").disabled = true; ["id", "title", "updated", "category", "tags", "description", "password", "passwordHint"].forEach((id) => $(id).value = ""); $("published").value = today; ["draft", "pinned", "encrypted", "hideHomeContent"].forEach((id) => $(id).checked = false); editor.setMarkdown(""); updateEncryptionFields(); renderList(); setStatus(""); $("title").focus(); }
    function renderList() { const query = $("filter").value.trim().toLowerCase(); const filtered = posts.filter((post) => `${post.title} ${post.id}`.toLowerCase().includes(query)); $("post-list").innerHTML = filtered.length ? filtered.map((post) => `<button class="post-item ${post.id === currentId ? "active" : ""}" data-id="${encodeURIComponent(post.id)}"><span class="post-title"><strong>${escapeHtml(post.title)}</strong>${post.encrypted ? '<i data-lucide="lock-keyhole"></i>' : ""}</span><small>${escapeHtml(dateValue(post.published) || "未设置日期")} · ${post.draft ? "草稿" : "已发布"}</small></button>`).join("") : '<div class="empty">暂无文章</div>'; document.querySelectorAll(".post-item").forEach((element) => { element.onclick = () => loadPost(decodeURIComponent(element.dataset.id)); }); lucide.createIcons({ attrs: { "stroke-width": 1.8 } }); }
    async function loadPosts() { const response = await fetch("/api/admin/posts/"); const result = await response.json(); if (!response.ok) throw new Error(result.error); posts = result.posts; renderList(); }
    async function loadPost(id) { const response = await fetch(`/api/admin/post/?id=${encodeURIComponent(id)}`); const result = await response.json(); if (!response.ok) return setStatus(result.error, true); const data = result.data || {}; currentId = result.id; $("editor-title").textContent = "编辑文章"; $("editor-subtitle").textContent = result.id; $("delete").disabled = false; $("id").value = result.id; $("title").value = data.title || ""; $("published").value = dateValue(data.published); $("updated").value = dateValue(data.updated); $("category").value = data.category || ""; $("tags").value = Array.isArray(data.tags) ? data.tags.join(", ") : ""; $("description").value = data.description || ""; $("draft").checked = data.draft === true; $("pinned").checked = data.pinned === true; $("encrypted").checked = data.encrypted === true; $("password").value = data.password || ""; $("passwordHint").value = data.passwordHint || ""; $("hideHomeContent").checked = data.hideHomeContent === true || Boolean(data.password); editor.setMarkdown(result.content || "", false); updateEncryptionFields(); renderList(); setStatus(""); }
    async function savePost() { const encrypted = $("encrypted").checked; if (encrypted && !$("password").value) return setStatus("启用密码保护后必须填写访问密码", true); const data = { title: $("title").value.trim(), published: $("published").value, description: $("description").value.trim(), tags: $("tags").value.split(",").map((value) => value.trim()).filter(Boolean), category: $("category").value.trim(), draft: $("draft").checked, pinned: $("pinned").checked, lang: "zh-CN", encrypted, password: encrypted ? $("password").value : "", passwordHint: encrypted ? $("passwordHint").value.trim() : "", hideHomeContent: $("hideHomeContent").checked }; if ($("updated").value) data.updated = $("updated").value; const response = await fetch("/api/admin/post/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: $("id").value.trim(), originalId: currentId, data, content: editor.getMarkdown() }) }); const result = await response.json(); if (!response.ok) return setStatus(result.error, true); currentId = result.id; await loadPosts(); await loadPost(currentId); setStatus("文章已保存"); }
    async function deletePost() { if (!currentId || !confirm("确定删除这篇文章吗？此操作会删除对应的 Markdown 文件。")) return; const response = await fetch("/api/admin/post/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: currentId }) }); const result = await response.json(); if (!response.ok) return setStatus(result.error, true); resetForm(); await loadPosts(); setStatus("文章已删除"); }
    let diaryItems = [], diaryCurrent = null, projectItems = [], projectCurrent = null, albumItems = [], albumCurrent = null;
    async function apiJson(url, options) { const response = await fetch(url, options); const result = await response.json(); if (!response.ok) throw new Error(result.error || "操作失败"); return result; }
    function switchModule(name) { const isPosts = name === "posts"; document.querySelector(".post-panel").style.display = isPosts ? "block" : "none"; document.querySelector(".editor-page").style.display = isPosts ? "block" : "none"; document.querySelectorAll(".module-page").forEach((panel) => panel.style.display = panel.id === `module-${name}` ? "block" : "none"); document.querySelectorAll(".nav-item[data-module]").forEach((item) => item.classList.toggle("active", item.dataset.module === name)); document.querySelector(".breadcrumb strong").textContent = { posts: "文章", diary: "日记", albums: "相册", projects: "项目" }[name]; if (name === "diary") loadDiary(); if (name === "albums") loadAlbums(); if (name === "projects") loadProjects(); }
    function renderDiaryList() { $("diary-list").innerHTML = diaryItems.length ? diaryItems.map((item) => `<button class="module-row ${item.id === diaryCurrent ? "active" : ""}" data-id="${item.id}"><strong>${escapeHtml(item.content.slice(0, 36))}</strong><small>${escapeHtml(dateValue(item.date))}</small></button>`).join("") : '<div class="empty">暂无日记</div>'; document.querySelectorAll("#diary-list .module-row").forEach((el) => el.onclick = () => loadDiaryItem(Number(el.dataset.id))); }
    function resetDiary() { diaryCurrent = null; ["diary-location", "diary-mood", "diary-tags", "diary-images", "diary-content"].forEach((id) => $(id).value = ""); $("diary-date").value = new Date().toISOString().slice(0, 16); $("diary-delete").disabled = true; renderDiaryList(); }
    function loadDiaryItem(id) { const item = diaryItems.find((entry) => Number(entry.id) === id); if (!item) return; diaryCurrent = id; $("diary-date").value = String(item.date || "").slice(0, 16); $("diary-location").value = item.location || ""; $("diary-mood").value = item.mood || ""; $("diary-tags").value = (item.tags || []).join(", "); $("diary-images").value = (item.images || []).join(", "); $("diary-content").value = item.content || ""; $("diary-delete").disabled = false; renderDiaryList(); }
    async function loadDiary() { diaryItems = (await apiJson("/api/admin/diary/")).items; renderDiaryList(); if (diaryCurrent === null) resetDiary(); }
    async function saveDiary() { const item = { id: diaryCurrent || Date.now(), date: new Date($("diary-date").value || new Date()).toISOString(), content: $("diary-content").value, location: $("diary-location").value, mood: $("diary-mood").value, tags: $("diary-tags").value.split(",").map((v) => v.trim()).filter(Boolean), images: $("diary-images").value.split(",").map((v) => v.trim()).filter(Boolean) }; await apiJson("/api/admin/diary/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ item }) }); await loadDiary(); diaryCurrent = item.id; loadDiaryItem(item.id); setStatus("日记已保存"); }
    async function uploadDiaryImages() { const files = [...($("diary-upload")?.files || [])]; if (!files.length) return; const urls = []; for (const file of files) { const result = await uploadToCloudinary(file); urls.push(result.secure_url); } const current = $("diary-images").value.split(",").map((v) => v.trim()).filter(Boolean); $("diary-images").value = [...current, ...urls].join(", "); $("diary-upload").value = ""; setStatus(`已上传 ${urls.length} 张日记图片`); }
    async function deleteDiary() { if (!diaryCurrent || !confirm("确定删除这条日记吗？")) return; await apiJson("/api/admin/diary/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: diaryCurrent }) }); resetDiary(); await loadDiary(); setStatus("日记已删除"); }
    function renderProjectList() { $("project-list").innerHTML = projectItems.length ? projectItems.map((item) => `<button class="module-row ${item.id === projectCurrent ? "active" : ""}" data-id="${escapeHtml(item.id)}"><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.status || "")}</small></button>`).join("") : '<div class="empty">暂无项目</div>'; document.querySelectorAll("#project-list .module-row").forEach((el) => el.onclick = () => loadProjectItem(el.dataset.id)); }
    function resetProject() { projectCurrent = null; ["project-id", "project-title", "project-description", "project-tech", "project-tags", "project-image", "project-visit", "project-source", "project-end"].forEach((id) => $(id).value = ""); $("project-category").value = "web"; $("project-status").value = "planned"; $("project-start").value = today; $("project-featured").checked = false; $("project-delete").disabled = true; renderProjectList(); }
    function loadProjectItem(id) { const item = projectItems.find((entry) => entry.id === id); if (!item) return; projectCurrent = id; $("project-id").value = item.id; $("project-title").value = item.title || ""; $("project-description").value = item.description || ""; $("project-category").value = item.category || "other"; $("project-status").value = item.status || "planned"; $("project-start").value = dateValue(item.startDate); $("project-end").value = dateValue(item.endDate); $("project-tech").value = (item.techStack || []).join(", "); $("project-tags").value = (item.tags || []).join(", "); $("project-image").value = item.image || ""; $("project-visit").value = item.visitUrl || ""; $("project-source").value = item.sourceCode || ""; $("project-featured").checked = item.featured === true; $("project-delete").disabled = false; renderProjectList(); }
    async function loadProjects() { projectItems = (await apiJson("/api/admin/projects/")).items; renderProjectList(); if (projectCurrent === null) resetProject(); }
    async function saveProject() { const item = { id: $("project-id").value.trim(), title: $("project-title").value.trim(), description: $("project-description").value.trim(), category: $("project-category").value, status: $("project-status").value, startDate: $("project-start").value, endDate: $("project-end").value || undefined, techStack: $("project-tech").value.split(",").map((v) => v.trim()).filter(Boolean), tags: $("project-tags").value.split(",").map((v) => v.trim()).filter(Boolean), image: $("project-image").value.trim(), visitUrl: $("project-visit").value.trim(), sourceCode: $("project-source").value.trim(), featured: $("project-featured").checked, showImage: true }; await apiJson("/api/admin/projects/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ item }) }); await loadProjects(); projectCurrent = item.id; loadProjectItem(item.id); setStatus("项目已保存"); }
    async function uploadProjectImage() { const file = $("project-upload")?.files?.[0]; if (!file) return; const result = await uploadToCloudinary(file); $("project-image").value = result.secure_url; $("project-upload").value = ""; setStatus("项目图片上传成功"); }
    async function deleteProject() { if (!projectCurrent || !confirm("确定删除这个项目吗？")) return; await apiJson("/api/admin/projects/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: projectCurrent }) }); resetProject(); await loadProjects(); setStatus("项目已删除"); }
    function renderAlbumList() { $("album-list").innerHTML = albumItems.length ? albumItems.map((item) => `<button class="module-row ${item.id === albumCurrent ? "active" : ""}" data-id="${escapeHtml(item.id)}"><strong>${escapeHtml(item.title || item.id)}</strong><small>${item.imageCount || 0} 张本地照片</small></button>`).join("") : '<div class="empty">暂无相册</div>'; document.querySelectorAll("#album-list .module-row").forEach((el) => el.onclick = () => loadAlbumItem(el.dataset.id)); }
    function resetAlbum() { albumCurrent = null; ["album-id", "album-title", "album-description", "album-location", "album-tags", "album-cover", "album-password", "album-password-hint", "album-photos"].forEach((id) => $(id).value = ""); $("album-date").value = today; $("album-external").checked = false; $("album-hidden").checked = false; $("album-delete").disabled = true; renderAlbumList(); }
    function renderAlbumImages(images = []) { $("album-images").innerHTML = images.length ? images.map((image) => `<div class="album-image"><img src="${escapeHtml(image.url)}" alt="${escapeHtml(image.name)}"><div class="album-image-actions">${image.cover ? '<button type="button" disabled>封面</button>' : `<button type="button" data-cover="${escapeHtml(image.name)}">设为封面</button>`}<button type="button" class="delete-image" data-delete="${escapeHtml(image.name)}">删除</button></div></div>`).join("") : '<small class="save-note">该相册暂无本地图片。</small>'; document.querySelectorAll("[data-cover]").forEach((el) => el.onclick = () => setAlbumCover(el.dataset.cover)); document.querySelectorAll("[data-delete]").forEach((el) => el.onclick = () => deleteAlbumImage(el.dataset.delete)); }
    function loadAlbumItem(id) { const item = albumItems.find((entry) => entry.id === id); if (!item) return; albumCurrent = id; $("album-id").value = item.id; $("album-title").value = item.title || ""; $("album-description").value = item.description || ""; $("album-date").value = dateValue(item.date); $("album-location").value = item.location || ""; $("album-tags").value = (item.tags || []).join(", "); $("album-cover").value = item.cover || ""; $("album-password").value = item.password || ""; $("album-password-hint").value = item.passwordHint || ""; $("album-external").checked = item.mode === "external"; $("album-hidden").checked = item.hidden === true; $("album-photos").value = item.photos ? JSON.stringify(item.photos, null, 2) : ""; $("album-delete").disabled = false; renderAlbumImages(item.images || []); renderAlbumList(); }
    async function setAlbumCover(name) { const id = $("album-id").value.trim(); const image = (albumCurrent && albumItems.find((entry) => entry.id === albumCurrent)?.images || []).find((entry) => entry.name === name); if (!id || !image) return; await apiJson("/api/admin/album-image/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ albumId: id, name: image.name, id: image.id, publicId: image.publicId, url: image.url, cover: true }) }); await loadAlbums(); albumCurrent = id; loadAlbumItem(id); setStatus("封面已更新"); }
    async function deleteAlbumImage(name) { const id = $("album-id").value.trim(); if (!id || !confirm(`确定删除图片 ${name} 吗？`)) return; await apiJson("/api/admin/album-image/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ albumId: id, name }) }); await loadAlbums(); albumCurrent = id; loadAlbumItem(id); setStatus("图片已删除"); }
    async function loadAlbums() { albumItems = (await apiJson("/api/admin/albums/")).items; renderAlbumList(); if (albumCurrent === null) resetAlbum(); }
    async function saveAlbum() { const external = $("album-external").checked; let photos = []; if (external && $("album-photos").value.trim()) { try { photos = JSON.parse($("album-photos").value); } catch { return setStatus("外链照片 JSON 格式错误", true); } } const item = { id: $("album-id").value.trim(), title: $("album-title").value.trim(), description: $("album-description").value, date: $("album-date").value, location: $("album-location").value, tags: $("album-tags").value.split(",").map((v) => v.trim()).filter(Boolean), cover: $("album-cover").value.trim(), password: $("album-password").value, passwordHint: $("album-password-hint").value, hidden: $("album-hidden").checked, mode: external ? "external" : "local", photos }; await apiJson("/api/admin/albums/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ item }) }); await loadAlbums(); albumCurrent = item.id; loadAlbumItem(item.id); setStatus("相册已保存"); }
    async function uploadAlbumImages() { const id = $("album-id").value.trim(); const files = [...$("album-upload").files]; if (!id || !files.length) return; for (const file of files) { const result = await uploadToCloudinary(file); await apiJson("/api/admin/album-image/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ albumId: id, name: result.original_filename || file.name, publicId: result.public_id, deleteToken: result.delete_token, url: result.secure_url }) }); } $("album-upload").value = ""; await loadAlbums(); albumCurrent = id; loadAlbumItem(id); setStatus(`已上传 ${files.length} 张照片`); }
    async function deleteAlbum() { if (!albumCurrent || !confirm("确定删除这个相册及其照片吗？")) return; await apiJson("/api/admin/albums/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: albumCurrent }) }); resetAlbum(); await loadAlbums(); setStatus("相册已删除"); }
    document.querySelectorAll(".nav-item[data-module]").forEach((item) => item.onclick = () => switchModule(item.dataset.module)); $("diary-upload")?.addEventListener("change", () => uploadDiaryImages().catch((error) => setStatus(error.message, true))); $("project-upload")?.addEventListener("change", () => uploadProjectImage().catch((error) => setStatus(error.message, true))); $("diary-new").onclick = resetDiary; $("diary-save").onclick = () => saveDiary().catch((error) => setStatus(error.message, true)); $("diary-delete").onclick = () => deleteDiary().catch((error) => setStatus(error.message, true)); $("project-new").onclick = resetProject; $("project-save").onclick = () => saveProject().catch((error) => setStatus(error.message, true)); $("project-delete").onclick = () => deleteProject().catch((error) => setStatus(error.message, true)); $("album-new").onclick = resetAlbum; $("album-save").onclick = () => saveAlbum().then(uploadAlbumImages).catch((error) => setStatus(error.message, true)); $("album-delete").onclick = () => deleteAlbum().catch((error) => setStatus(error.message, true));
    $("new-post").onclick = resetForm; $("filter").oninput = renderList; $("save").onclick = () => savePost().catch((error) => setStatus(error.message, true)); $("delete").onclick = () => deletePost().catch((error) => setStatus(error.message, true)); $("encrypted").onchange = updateEncryptionFields; $("toggle-password").onclick = () => { const show = $("password").type === "password"; $("password").type = show ? "text" : "password"; $("toggle-password").innerHTML = `<i data-lucide="${show ? "eye-off" : "eye"}"></i>`; lucide.createIcons(); }; resetForm(); loadPosts().catch((error) => setStatus(error.message, true));
  </script>
