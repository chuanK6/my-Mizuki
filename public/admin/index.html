<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mizuki 管理后台</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#243142;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #dde3ea;padding:20px 14px}.side h1{font-size:18px;margin:0 0 20px}.side button{display:block;width:100%;padding:10px;border:0;border-radius:5px;background:transparent;text-align:left;cursor:pointer}.side button.active,.side button:hover{background:#eaf3ff;color:#1769d5}.main{max-width:1100px;width:100%;padding:28px;margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel{background:#fff;border:1px solid #dde3ea;border-radius:7px;padding:18px;margin-bottom:16px}label{display:grid;gap:6px;font-size:13px;color:#536273;margin-bottom:14px}input,textarea{font:inherit;border:1px solid #cbd5df;border-radius:5px;padding:9px;background:#fff}textarea{min-height:480px;resize:vertical}.row{display:flex;gap:10px;align-items:center}.btn{border:1px solid #c5d0db;border-radius:5px;background:#fff;padding:9px 14px;cursor:pointer}.btn.primary{background:#1677ff;color:#fff;border-color:#1677ff}.btn.danger{color:#bd3944}.muted{color:#7c8895;font-size:13px}.hidden{display:none!important}#items{display:grid;gap:4px;max-height:330px;overflow:auto}.item{padding:10px;border:1px solid transparent;border-radius:5px;text-align:left;background:transparent;cursor:pointer}.item:hover,.item.active{background:#eaf3ff;border-color:#cce2ff}.status{min-height:22px;color:#2c7a42}.error{color:#c13945}.login{max-width:380px;margin:15vh auto}.login h1{margin-top:0}@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:static;border-right:0;border-bottom:1px solid #dde3ea}.main{padding:18px}}
</style></head>
<body>
<section id="login" class="login panel"><h1>Mizuki 管理后台</h1><form id="login-form"><label>账号<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">登录</button><p id="login-status" class="status"></p></form></section>
<div id="app" class="app hidden"><aside class="side"><h1>Mizuki 管理</h1><button data-kind="posts" class="active">文章</button><button data-kind="diary">日记</button><button data-kind="projects">项目</button><button data-kind="albums">相册</button><button id="logout">退出登录</button></aside><main class="main"><div class="bar"><div><h2 id="heading">文章</h2><p class="muted">保存后会提交 GitHub 并触发 Cloudflare Pages 重建。</p></div><button id="new" class="btn">新建</button></div><div id="list-panel" class="panel"><div id="items"></div></div><div class="panel"><label>文件路径<input id="path" placeholder="src/content/posts/example.md"></label><label>文件内容<textarea id="content" spellcheck="false"></textarea></label><div class="row"><button id="save" class="btn primary">提交保存</button><button id="remove" class="btn danger">删除文件</button><span id="status" class="status"></span></div></div></main></div>
<script>
const $=id=>document.getElementById(id);let kind="posts",current="";const labels={posts:"文章",diary:"日记",projects:"项目",albums:"相册"};
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||"请求失败");return d}
function status(msg,error=false){$("status").textContent=msg;$("status").className=error?"status error":"status"}
function loginStatus(msg,error=false){$("login-status").textContent=msg;$("login-status").className=error?"status error":"status"}
async function loadList(){if(kind==="posts"){const d=await api("/api/admin/posts");$("items").innerHTML=d.posts.map(p=>`<button class="item" data-path="src/content/posts/${p.id}">${p.id}</button>`).join("")}else{$("items").innerHTML=`<button class="item" data-path="${kindPath(kind)}">编辑 ${labels[kind]} 数据文件</button>`}document.querySelectorAll(".item").forEach(b=>b.onclick=()=>loadFile(b.dataset.path))}
function kindPath(k){return k==="diary"?"src/data/diary.ts":k==="projects"?"src/data/projects.ts":"public/images/albums"}
async function loadFile(path){if(path.endsWith("/albums")){status("请直接编辑具体相册的 info.json",true);return}const d=await api(`/api/admin/file?path=${encodeURIComponent(path)}`);current=path;$("path").value=path;$("content").value=d.content;document.querySelectorAll(".item").forEach(b=>b.classList.toggle("active",b.dataset.path===path));status("")}
const CLOUDINARY_CLOUD="wmu4lce4",CLOUDINARY_PRESET="muri10086";
async function uploadImage(){let file=document.querySelector("#image-upload")?.files?.[0];if(!file){file=await new Promise(resolve=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>resolve(i.files[0]);i.click()});}if(!file)return;try{const form=new FormData();form.append("file",file);form.append("upload_preset",CLOUDINARY_PRESET);form.append("folder","boke");const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`,{method:"POST",body:form});const d=await r.json();if(!r.ok)throw Error(d.error?.message||"Cloudinary 上传失败");const ta=$("content"),syntax=`![${d.original_filename||"image"}](${d.secure_url})`,start=ta.selectionStart,end=ta.selectionEnd;ta.value=ta.value.slice(0,start)+syntax+ta.value.slice(end);status("图片已上传并插入 Markdown")}catch(e){status(e.message,true)}}
async function init(){try{const s=await api("/api/admin/session");if(!s.authenticated)return;$("login").classList.add("hidden");$("app").classList.remove("hidden");const b=document.createElement("button");b.className="btn";b.textContent="上传 Cloudinary 图片";b.onclick=uploadImage;$("save").parentElement.prepend(b);await loadList()}catch(e){loginStatus(e.message,true)}}
$("login-form").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})});$("login").classList.add("hidden");$("app").classList.remove("hidden");await loadList()}catch(e){loginStatus(e.message,true)}};
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=async()=>{kind=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("active",x===b));$("heading").textContent=labels[kind];current="";$("path").value="";$("content").value="";await loadList()});
$("new").onclick=()=>{current="";$("path").value=kind==="posts"?"src/content/posts/new-post.md":kindPath(kind);$("content").value="";status("")};
$("save").onclick=async()=>{try{if(!$("path").value.trim())throw Error("文件路径不能为空");await api("/api/admin/file",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:$("path").value.trim(),content:$("content").value,message:`在线更新 ${$("path").value.trim()}`})});current=$("path").value.trim();status("已提交，等待 Cloudflare Pages 构建");await loadList()}catch(e){status(e.message,true)}};
$("remove").onclick=async()=>{if(!current||!confirm("确认删除当前文件？"))return;try{await api("/api/admin/file",{method:"DELETE",headers:{"content-type":"application/json"},body:JSON.stringify({path:current})});$("path").value="";$("content").value="";current="";status("已删除并提交");await loadList()}catch(e){status(e.message,true)}};
$("logout").onclick=async()=>{await api("/api/admin/logout");location.reload()};init();
</script></body></html>
