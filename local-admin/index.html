<html lang="zh-CN">

  <link rel="stylesheet" href="/admin/vendor/toastui-editor.min.css">
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #263448; background: #f4f6fa; font-size: 14px; --accent: #5264db; --accent-soft: #eef0ff; --border: #e5e9f1; --muted: #8490a3; --topbar: 76px; --list-width: 268px; }
    * { box-sizing: border-box; } body { margin: 0; min-width: 360px; } button, input, textarea, select { font: inherit; } button, a { -webkit-tap-highlight-color: transparent; } button { cursor: pointer; } button, a, input, textarea, select { transition: background .15s, border-color .15s, box-shadow .15s; } a { color: inherit; text-decoration: none; } button:focus-visible, a:focus-visible { outline: 3px solid #bac3ff; outline-offset: 3px; } svg { flex-shrink: 0; } .hidden { display: none !important; }

    .workspace { min-width: 0; } .topbar { height: var(--topbar); display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 30px; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); background: #ffffffed; backdrop-filter: blur(16px); } .breadcrumb { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; } .breadcrumb svg { width: 14px; height: 14px; } .breadcrumb strong { color: #39455a; font-weight: 600; } .actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; } .topbar-actions { gap: 12px; }

    .form-section { background: #fff; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 20px; box-shadow: 0 3px 12px #25354d03; min-width: 0; } .section-title { min-height: 56px; padding: 16px 22px; border-bottom: 1px solid #eef0f5; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 650; } .section-title svg { width: 16px; height: 16px; color: #8995b0; } .form-body { padding: 22px; } .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; } .field { min-width: 0; display: flex; flex-direction: column; gap: 9px; color: #66738a; font-size: 12px; font-weight: 500; } .field.full { grid-column: 1 / -1; } .field-label { display: inline-flex; align-items: center; gap: 4px; } .required { color: #ce7b87; }

    .body-heading { justify-content: space-between; flex-wrap: wrap; gap: 12px; } .body-heading > span { display: inline-flex; gap: 9px; align-items: center; } .editor-modes { display: flex; gap: 3px; padding: 4px; background: #f3f5fa; border-radius: 9px; } .editor-modes button { border: 0; border-radius: 6px; padding: 6px 10px; color: #7c889e; background: transparent; font-size: 12px; } .editor-modes button.active { background: #fff; color: var(--accent); box-shadow: 0 1px 4px #26344810; } .editor-modes button:disabled { opacity: .45; cursor: not-allowed; } .editor-help { margin: 0; padding: 12px 22px; font-size: 12px; color: #8893a7; border-bottom: 1px solid #eef0f5; line-height: 1.7; } #source-panel { padding: 16px; } #source-editor { display: block; min-height: 520px; font-family: Consolas, "Cascadia Code", monospace; font-size: 13px; line-height: 1.8; tab-size: 2; } #content-preview { display: block; width: 100%; height: 560px; border: 0; border-radius: 0 0 14px 14px; background: white; } .toastui-editor-defaultUI { border: 0 !important; border-radius: 0 0 14px 14px !important; overflow: hidden; } .toastui-editor-defaultUI-toolbar { background: #fafbfe !important; border-bottom-color: #eef0f5 !important; } .toastui-editor-contents { font-family: "Microsoft YaHei", system-ui, sans-serif; } .save-note { color: #949eb0; font-size: 12px; line-height: 1.8; font-weight: 400; } #status { min-height: 20px; margin: 12px 0 0; color: #428568; font-size: 13px; } #status.error { color: #c1616d; }

    #toast { position: fixed; top: 82px; left: 50%; transform: translate(-50%, -8px); z-index: 100; width: max-content; max-width: calc(100vw - 32px); padding: 13px 22px; border-radius: 11px; background: #34435b; color: #fff; text-align: center; font-size: 13px; line-height: 1.6; box-shadow: 0 8px 28px #26344825; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; } #toast.show { opacity: 1; transform: translate(-50%, 0); } #toast.error { background: #b85868; }
    body.auth-locked > *:not(#auth-gate) { display: none !important; } #auth-gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #eaedff, #f7f8fc 65%); } #auth-gate form { width: min(390px, 100%); display: grid; gap: 22px; padding: 36px; border: 1px solid #fff; border-radius: 20px; background: #ffffffed; box-shadow: 0 18px 60px #5264db0d; } #auth-gate h1 { margin: 0 0 6px; font-size: 22px; } #auth-gate label { display: grid; gap: 9px; color: #66738a; font-size: 12px; } #auth-error { min-height: 18px; margin: 0; color: #c1616d; font-size: 12px; }
    @media (min-width: 1700px) { :root { --list-width: 296px; } .shell { grid-template-columns: 224px minmax(0, 1fr); } .editor-page, .module-editor { padding-inline: 42px; } }
    @media (max-width: 1250px) { :root { --list-width: 230px; } .shell { grid-template-columns: 176px minmax(0, 1fr); } .brand { padding-inline: 16px; font-size: 14px; } .nav-group { padding-inline: 10px; } .nav-item { padding-inline: 12px; } .editor-page, .module-editor { padding: 26px 22px 48px; } .topbar { padding-inline: 24px; } .editor-head, .module-header { align-items: flex-start; flex-wrap: wrap; } }
    @media (max-width: 1000px) { .shell { grid-template-columns: 76px minmax(0, 1fr); } .brand { padding-inline: 21px; } .brand-name, .nav-item span { display: none; } .nav-group { padding-inline: 12px; } .nav-item { justify-content: center; padding-inline: 0; } .grid { gap: 18px; } .form-body { padding: 18px; } }
    @media (max-width: 760px) { :root { --topbar: 68px; --list-width: 200px; } .topbar { padding-inline: 18px; gap: 12px; } .breadcrumb > span, .breadcrumb > svg { display: none; } .topbar-actions { gap: 8px; } .topbar-actions .btn { padding: 8px 10px; font-size: 12px; } #deploy { padding-inline: 10px; } .grid { grid-template-columns: minmax(0, 1fr); } .editor-page, .module-editor { padding: 22px 16px 40px; } .section-title { padding-inline: 18px; } .body-heading { align-items: flex-start; } .panel-head { padding: 18px 14px; } }
    @media (max-width: 600px) { body { min-width: 360px; } .shell { display: block; } .nav { position: static; height: auto; border-right: 0; background: #fff; } .brand { display: none; } .nav-group { display: flex; padding: 10px 12px; gap: 5px; border-bottom: 1px solid var(--border); } .nav-item { flex: 1; min-height: 42px; gap: 6px; font-size: 12px; padding: 8px 4px; border-radius: 8px; } .nav-item span { display: inline; } .nav-item svg { width: 15px; height: 15px; } .page, .module-grid { display: block; } .post-panel, .module-list.form-section { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); } .panel-head { min-height: 62px; padding: 14px 18px; } .search-wrap { margin-bottom: 6px; } .list-tools { margin-bottom: 8px; } #post-list, #diary-list, #project-list, #album-list { max-height: 195px; padding-bottom: 12px; } .post-item, .module-row { padding: 10px 12px; } .editor-head h1, .module-header h1 { font-size: 21px; } .grid { grid-template-columns: minmax(0, 1fr); } .topbar { z-index: 30; } #source-editor { min-height: 400px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body class="auth-locked">
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="auth-gate"><form id="auth-form"><h1>暮日 管理后台</h1><label>账号<input id="auth-username" autocomplete="username" required></label><label>密码<input id="auth-password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">登录</button><p id="auth-error"></p></form></div>
  <div class="shell"><aside class="nav"><div class="brand"><span class="brand-mark"><i data-lucide="feather"></i></span><span class="brand-name">暮日 管理台</span></div><nav class="nav-group" aria-label="管理模块"><button class="nav-item active" data-module="posts" title="文章管理" aria-label="文章管理"><i data-lucide="file-text"></i><span>文章管理</span></button><button class="nav-item" data-module="diary" title="日记管理" aria-label="日记管理"><i data-lucide="notebook-pen"></i><span>日记管理</span></button><button class="nav-item" data-module="albums" title="相册管理" aria-label="相册管理"><i data-lucide="images"></i><span>相册管理</span></button><button class="nav-item" data-module="projects" title="项目管理" aria-label="项目管理"><i data-lucide="folder-kanban"></i><span>项目管理</span></button></nav></aside>
  <div class="workspace"><header class="topbar"><div class="breadcrumb"><span>内容管理</span><i data-lucide="chevron-right"></i><strong>文章</strong></div><div class="actions topbar-actions"><a class="btn website-link" href="/" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link"></i>查看网站</a><button class="btn primary" id="deploy" type="button"><i data-lucide="rocket"></i><span>部署更新</span></button></div></header><main class="page"><aside class="post-panel"><div class="panel-head"><h2>文章列表</h2><button class="btn icon primary" id="new-post" title="新建文章"><i data-lucide="plus"></i></button></div><div class="search-wrap"><i data-lucide="search"></i><input aria-label="搜索文章" id="filter" placeholder="搜索标题或路径"></div><div class="list-tools"><label class="sort-label"><i data-lucide="arrow-down-wide-narrow"></i><select id="post-sort" aria-label="文章排序方式"><option value="recent">最近修改优先</option><option value="oldest">最早修改优先</option></select></label></div><div id="post-list"></div></aside>
  <article class="editor-page"><div class="editor-head"><div><h1 id="editor-title">新建文章</h1><p id="editor-subtitle">填写文章信息并编辑正文</p></div><div class="actions"><button class="btn danger" id="delete" disabled><i data-lucide="trash-2"></i>删除</button><button class="btn primary" id="save"><i data-lucide="save"></i>保存文章</button></div></div>
  <section class="form-section"><div class="section-title"><i data-lucide="info"></i>基础信息</div><div class="form-body grid"><label class="field"><span class="field-label">文件路径 <span class="required">*</span></span><input id="id" placeholder="例如 notes/hello（自动补全 .md）"></label><label class="field"><span class="field-label">标题 <span class="required">*</span></span><input id="title" placeholder="文章标题"></label><label class="field"><span class="field-label">发布日期 <span class="required">*</span></span><input id="published" type="date"></label><label class="field">更新时间<input id="updated" type="date"></label><label class="field">分类<input id="category" placeholder="例如 随笔"></label><label class="field">标签<input id="tags" placeholder="生活, 技术"></label><label class="field full">摘要<input id="description" placeholder="显示在文章列表中的摘要"></label></div></section>
  <section class="form-section"><div class="section-title body-heading"><span><i data-lucide="pen-line"></i>文章正文</span><div class="editor-modes" role="group" aria-label="正文编辑模式"><button type="button" id="mode-rich" data-editor-mode="rich" class="active" aria-pressed="true">富文本</button><button type="button" id="mode-source" data-editor-mode="source" aria-pressed="false">Markdown / HTML</button><button type="button" id="mode-preview" data-editor-mode="preview" aria-pressed="false">预览</button></div></div><p class="editor-help" id="editor-help">可视化编辑正文，也可以切换到 Markdown / HTML 输入源码。</p><div id="editor"></div><div id="source-panel" class="hidden"><textarea id="source-editor" aria-label="Markdown / HTML 正文源码" spellcheck="false" placeholder="输入 Markdown 或 HTML，例如 &lt;div style=&quot;color: #5264db&quot;&gt;你好，世界&lt;/div&gt;"></textarea></div><iframe id="content-preview" class="hidden" title="文章正文预览" sandbox="" referrerpolicy="no-referrer"></iframe></section>

  <section class="form-section"><div class="section-title"><i data-lucide="shield-check"></i>访问保护</div><div class="form-body"><div class="switches"><label class="check"><input id="encrypted" type="checkbox">启用密码保护</label><label class="check"><input id="hideHomeContent" type="checkbox">隐藏首页文章摘要</label></div><div class="encrypt-fields hidden" id="encrypt-fields"><div class="grid"><label class="field"><span class="field-label">访问密码 <span class="required">*</span></span><span class="password-wrap"><input id="password" type="password" autocomplete="new-password" placeholder="读者打开文章时需要输入"><button id="toggle-password" type="button" title="显示或隐藏密码"><i data-lucide="eye"></i></button></span></label><label class="field">密码提示<input id="passwordHint" placeholder="例如：我的生日"></label></div></div></div></section><div class="save-note">编辑完成后保存内容；点击右上角「部署更新」发布到网站。</div><p id="status"></p></article>

t-tech" placeholder="Astro, TypeScript"></label><label class="field">标签<input id="project-tags" placeholder="开源, 博客"></label><label class="field">封面图片<input id="project-image" placeholder="/assets/projects/demo.webp"></label><label class="field">演示地址<input id="project-visit"></label><label class="field">源码地址<input id="project-source"></label><label class="check"><input id="project-featured" type="checkbox">精选项目</label></div></div></article></div></section>

f,image/webp,image/avif" multiple><small class="save-note">先保存相册，再选择照片上传。上传后会显示在下方。</small></label><div class="field full"><span>本地照片</span><div id="album-images" class="album-images"><small class="save-note">选择一个相册后显示照片。</small></div></div><label class="field full">外链照片 JSON（外链模式）<textarea id="album-photos" rows="5" placeholder='[{"src":"https://example.com/photo.jpg","title":"照片"}]'></textarea></label></div></div></article></div></section>

  <script src="/admin/vendor/marked.umd.js"></script>
  <script>
    const $ = (id) => document.getElementById(id); const today = new Date().toISOString().slice(0, 10); let currentId = null; let posts = [];
    async function checkOnlineSession() { try { const response = await fetch("/api/admin/session"); const result = await response.json(); if (!result.authenticated) return false; document.body.classList.remove("auth-locked"); $("auth-gate")?.remove(); return true; } catch { return false; } }
    $("deploy").onclick = deployChanges;
    async function deployChanges() { const button = $("deploy"); if (button) button.disabled = true; try { const response = await fetch("/api/admin/deploy/", { method: "POST" }); const result = await response.json(); if (!response.ok) throw new Error(result.error || "部署失败"); setStatus(result.message || "已提交部署"); } catch (error) { setStatus(error.message || "部署失败", true); } finally { if (button) button.disabled = false; } }
    $("auth-form").onsubmit = async (event) => { event.preventDefault(); $("auth-error").textContent = "正在登录..."; try { const response = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("auth-username").value, password: $("auth-password").value }) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || "登录失败"); location.reload(); } catch (error) { $("auth-error").textContent = error.message; } };
    lucide.createIcons({ attrs: { "stroke-width": 1.8 } });
    const originalSetStatus = setStatus; setStatus = (message, error = false) => { originalSetStatus(message, error); const toast = $("toast"); if (toast && message) { toast.textContent = message; toast.className = error ? "error show" : "show"; clearTimeout(window.__mizukiToastTimer); window.__mizukiToastTimer = setTimeout(() => { toast.className = ""; }, 3200); } };
    const CLOUDINARY_CLOUD = "wmu4lce4"; const CLOUDINARY_PRESET = "muri10086"; const CLOUDINARY_FOLDER = "boke";
    if (!$("project-upload")) { const input = document.createElement("input"); input.id = "project-upload"; input.type = "file"; input.accept = "image/*"; input.style.marginTop = "6px"; $("project-image")?.parentElement?.appendChild(input); }
    async function uploadToCloudinary(file) { const form = new FormData(); form.append("file", file); form.append("upload_preset", CLOUDINARY_PRESET); form.append("folder", CLOUDINARY_FOLDER); const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`, { method: "POST", body: form }); const result = await response.json(); if (!response.ok || !result.secure_url) throw new Error(result.error?.message || "Cloudinary 上传失败"); return result; }
    const editor = new toastui.Editor({ el: $("editor"), height: "560px", initialEditType: "wysiwyg", previewStyle: "vertical", language: "zh-CN", usageStatistics: false, hideModeSwitch: true, toolbarItems: [["heading", "bold", "italic", "strike"], ["hr", "quote"], ["ul", "ol", "task", "indent", "outdent"], ["table", "image", "link"], ["code", "codeblock"]], hooks: { addImageBlobHook: async (blob, callback) => { try { setStatus("正在上传图片到 Cloudinary..."); const result = await uploadToCloudinary(blob); callback(result.secure_url, blob.name || "文章图片"); setStatus("图片上传成功"); } catch (error) { setStatus(error.message || "图片上传失败", true); } } } });
    // Keep the source authoritative: HTML must never round-trip through WYSIWYG.
    let articleSource = "", editorMode = "rich", richDirty = false, syncingEditor = false;
    editor.on("change", () => { if (!syncingEditor) richDirty = true; });
    function containsHtml(content) {
      let found = false;
      marked.walkTokens(marked.lexer(content), (token) => { if (token.type === "html") found = true; });
      return found;
    }
    function getArticleContent() {
      if (editorMode === "source") return $("source-editor").value;
      return editorMode === "rich" && richDirty ? editor.getMarkdown() : articleSource;
    }
    function syncRichEditor(content) {
      syncingEditor = true;
      try { editor.setMarkdown(content, false); } finally { syncingEditor = false; richDirty = false; }
    }
    function updateEditorHelp() {
      const html = containsHtml(getArticleContent());
      $("mode-rich").disabled = html;
      $("mode-rich").title = html ? "含 HTML 的正文使用源码编辑，可完整保留标签与样式" : "可视化编辑";
      $("editor-help").textContent = editorMode === "preview"
        ? "预览支持常规 Markdown 与 HTML；站点专用语法以发布效果为准。"
        : html ? "已启用 HTML 源码编辑，保存时完整保留标签与样式。点击「预览」查看效果。"
        : editorMode === "source" ? "支持 Markdown 与 HTML 混合编写，源码将原样保存。"
        : "可视化编辑正文，也可以切换到 Markdown / HTML 输入源码。";
    }
    function renderContentPreview(content) {
      const html = marked.parse(content);
      $("content-preview").srcdoc = `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data: blob:; style-src 'unsafe-inline' https: http:; font-src https: http: data:;"><base href="${escapeHtml(location.origin)}/"><style>body{margin:0;padding:28px;color:#35435b;font:15px/1.8 system-ui,sans-serif;overflow-wrap:anywhere}img,video{max-width:100%;height:auto}pre{padding:16px;background:#f4f6fa;border-radius:8px;overflow:auto}code{font-family:Consolas,monospace}blockquote{margin-left:0;border-left:3px solid #cbd2f6;padding-left:18px;color:#8490a3}table{border-collapse:collapse}td,th{padding:8px 12px;border:1px solid #e5e9f1}a{color:#5264db}</style></head><body>${html}</body></html>`;
    }
    function setEditorMode(mode) {
      const content = getArticleContent();
      if (mode === "rich" && containsHtml(content)) return;
      articleSource = content;
      if (mode === "source") $("source-editor").value = content;
      if (mode === "rich" && editorMode !== "rich") syncRichEditor(content);
      editorMode = mode;
      $("editor").classList.toggle("hidden", mode !== "rich");
      $("source-panel").classList.toggle("hidden", mode !== "source");
      $("content-preview").classList.toggle("hidden", mode !== "preview");
      document.querySelectorAll("[data-editor-mode]").forEach((button) => {
        const active = button.dataset.editorMode === mode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      if (mode === "preview") renderContentPreview(content);
      updateEditorHelp();
    }
    function setArticleContent(content) {
      articleSource = content;
      $("source-editor").value = content;
      richDirty = false;
      editorMode = "source";
      setEditorMode(containsHtml(content) ? "source" : "rich");
    }
    document.querySelectorAll("[data-editor-mode]").forEach((button) => button.onclick = () => setEditorMode(button.dataset.editorMode));
    $("source-editor").addEventListener("input", updateEditorHelp);
    function itemDate(item) {
      for (const key of ["updated", "published", "date", "startDate"]) {
        if (!item[key]) continue;
        const timestamp = new Date(item[key]).getTime();
        if (Number.isFinite(timestamp)) return { timestamp, value: item[key], modified: key === "updated" };
      }
      return { timestamp: null, value: "", modified: false };
    }
    function sortedItems(items, list) {
      const ascending = $(list + "-sort").value === "oldest";
      return [...items].sort((a, b) => {
        const first = itemDate(a).timestamp, second = itemDate(b).timestamp;
        if (first === null && second !== null) return 1;
        if (second === null && first !== null) return -1;
        return (ascending ? (first ?? 0) - (second ?? 0) : (second ?? 0) - (first ?? 0))
          || String(a.id).localeCompare(String(b.id), "zh-CN", { numeric: true });
      });
    }
    function listDate(item) {
      const date = itemDate(item);
      if (!date.value) return "未设置日期";
      return `${date.modified ? "修改于" : "发布于"} ${dateValue(date.value)}`;
    }
    function fileToBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(",")[1] || ""); reader.onerror = () => reject(new Error("图片读取失败")); reader.readAsDataURL(file); }); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" })[char]); } function setStatus(message, error = false) { $("status").textContent = message; $("status").className = error ? "error" : ""; } function dateValue(value) { return String(value || "").slice(0, 10); } function updateEncryptionFields() { $("encrypt-fields").classList.toggle("hidden", !$("encrypted").checked); if ($("encrypted").checked) $("hideHomeContent").checked = true; }
    function resetForm() { currentId = null; $("editor-title").textContent = "新建文章"; $("editor-subtitle").textContent = "填写文章信息并编辑正文"; $("delete").disabled = true; ["id", "title", "updated", "category", "tags", "description", "password", "passwordHint"].forEach((id) => $(id).value = ""); $("published").value = today; ["draft", "pinned", "encrypted", "hideHomeContent"].forEach((id) => $(id).checked = false); setArticleContent(""); updateEncryptionFields(); renderList(); setStatus(""); $("title").focus(); }
    function renderList() { const query = $("filter").value.trim().toLowerCase(); const filtered = sortedItems(posts, "post").filter((post) => `${post.title} ${post.id}`.toLowerCase().includes(query)); $("post-list").innerHTML = filtered.length ? filtered.map((post) => `<button class="post-item ${post.id === currentId ? "active" : ""}" data-id="${encodeURIComponent(post.id)}"><span class="post-title"><strong>${escapeHtml(post.title)}</strong>${post.encrypted ? '<i data-lucide="lock-keyhole"></i>' : ""}</span><small>${escapeHtml(listDate(post))} · ${post.draft ? "草稿" : "已发布"}</small></button>`).join("") : '<div class="empty">暂无文章</div>'; document.querySelectorAll(".post-item").forEach((element) => { element.onclick = () => loadPost(decodeURIComponent(element.dataset.id)); }); lucide.createIcons({ attrs: { "stroke-width": 1.8 } }); }
    async function loadPosts() { const response = await fetch("/api/admin/posts/"); const result = await response.json(); if (!response.ok) throw new Error(result.error); posts = result.posts; renderList(); }
    async function loadPost(id) { const response = await fetch(`/api/admin/post/?id=${encodeURIComponent(id)}`); const result = await response.json(); if (!response.ok) return setStatus(result.error, true); const data = result.data || {}; currentId = result.id; $("editor-title").textContent = "编辑文章"; $("editor-subtitle").textContent = result.id; $("delete").disabled = false; $("id").value = result.id; $("title").value = data.title || ""; $("published").value = dateValue(data.published); $("updated").value = dateValue(data.updated); $("category").value = data.category || ""; $("tags").value = Array.isArray(data.tags) ? data.tags.join(", ") : ""; $("description").value = data.description || ""; $("draft").checked = data.draft === true; $("pinned").checked = data.pinned === true; $("encrypted").checked = data.encrypted === true; $("password").value = data.password || ""; $("passwordHint").value = data.passwordHint || ""; $("hideHomeContent").checked = data.hideHomeContent === true || Boolean(data.password); setArticleContent(result.content || ""); updateEncryptionFields(); renderList(); setStatus(""); }
    async function savePost() { const encrypted = $("encrypted").checked; if (encrypted && !$("password").value) return setStatus("启用密码保护后必须填写访问密码", true); const data = { title: $("title").value.trim(), published: $("published").value, description: $("description").value.trim(), tags: $("tags").value.split(",").map((value) => value.trim()).filter(Boolean), category: $("category").value.trim(), draft: $("draft").checked, pinned: $("pinned").checked, lang: "zh-CN", encrypted, password: encrypted ? $("password").value : "", passwordHint: encrypted ? $("passwordHint").value.trim() : "", hideHomeContent: $("hideHomeContent").checked }; if ($("updated").value) data.updated = $("updated").value; const response = await fetch("/api/admin/post/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: $("id").value.trim(), originalId: currentId, data, content: getArticleContent() }) }); const result = await response.json(); if (!response.ok) return setStatus(result.error, true); currentId = result.id; await loadPosts(); await loadPost(currentId); setStatus("文章已保存"); }
    async function deletePost() { if (!currentId || !confirm("确定删除这篇文章吗？此操作会删除对应的 Markdown 文件。")) return; const response = await fetch("/api/admin/post/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: currentId }) }); const result = await response.json(); if (!response.ok) return setStatus(result.error, true); resetForm(); await loadPosts(); setStatus("文章已删除"); }
    let diaryItems = [], diaryCurrent = null, projectItems = [], projectCurrent = null, albumItems = [], albumCurrent = null;
    async function apiJson(url, options) { const response = await fetch(url, options); const result = await response.json(); if (!response.ok) throw new Error(result.error || "操作失败"); return result; }
    function switchModule(name) { const isPosts = name === "posts"; document.querySelector(".post-panel").style.display = isPosts ? "block" : "none"; document.querySelector(".editor-page").style.display = isPosts ? "block" : "none"; document.querySelectorAll(".module-page").forEach((panel) => panel.style.display = panel.id === `module-${name}` ? "block" : "none"); document.querySelectorAll(".nav-item[data-module]").forEach((item) => item.classList.toggle("active", item.dataset.module === name)); document.querySelector(".breadcrumb strong").textContent = { posts: "文章", diary: "日记", albums: "相册", projects: "项目" }[name]; if (name === "diary") loadDiary().catch((error) => setStatus(error.message, true)); if (name === "albums") loadAlbums().catch((error) => setStatus(error.message, true)); if (name === "projects") loadProjects().catch((error) => setStatus(error.message, true)); }
    function renderDiaryList() { $("diary-list").innerHTML = diaryItems.length ? sortedItems(diaryItems, "diary").map((item) => `<button class="module-row ${item.id === diaryCurrent ? "active" : ""}" data-id="${item.id}"><strong>${escapeHtml(item.content.slice(0, 36))}</strong><small>${escapeHtml(listDate(item))}</small></button>`).join("") : '<div class="empty">暂无日记</div>'; document.querySelectorAll("#diary-list .module-row").forEach((el) => el.onclick = () => loadDiaryItem(Number(el.dataset.id))); }
    function resetDiary() { diaryCurrent = null; ["diary-location", "diary-mood", "diary-tags", "diary-images", "diary-content"].forEach((id) => $(id).value = ""); $("diary-date").value = new Date().toISOString().slice(0, 16); $("diary-delete").disabled = true; renderDiaryList(); }
    function loadDiaryItem(id) { const item = diaryItems.find((entry) => Number(entry.id) === id); if (!item) return; diaryCurrent = id; $("diary-date").value = String(item.date || "").slice(0, 16); $("diary-location").value = item.location || ""; $("diary-mood").value = item.mood || ""; $("diary-tags").value = (item.tags || []).join(", "); $("diary-images").value = (item.images || []).join(", "); $("diary-content").value = item.content || ""; $("diary-delete").disabled = false; renderDiaryList(); }
    async function loadDiary() { diaryItems = (await apiJson("/api/admin/diary/")).items; renderDiaryList(); if (diaryCurrent === null) resetDiary(); }
    async function saveDiary() { const item = { id: diaryCurrent || Date.now(), date: new Date($("diary-date").value || new Date()).toISOString(), content: $("diary-content").value, location: $("diary-location").value, mood: $("diary-mood").value, tags: $("diary-tags").value.split(",").map((v) => v.trim()).filter(Boolean), images: $("diary-images").value.split(",").map((v) => v.trim()).filter(Boolean) }; await apiJson("/api/admin/diary/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ item }) }); await loadDiary(); diaryCurrent = item.id; loadDiaryItem(item.id); setStatus("日记已保存"); }
    async function uploadDiaryImages() { const files = [...($("diary-upload")?.files || [])]; if (!files.length) return; const urls = []; for (const file of files) { const result = await uploadToCloudinary(file); urls.push(result.secure_url); } const current = $("diary-images").value.split(",").map((v) => v.trim()).filter(Boolean); $("diary-images").value = [...current, ...urls].join(", "); $("diary-upload").value = ""; setStatus(`已上传 ${urls.length} 张日记图片`); }
    async function deleteDiary() { if (!diaryCurrent || !confirm("确定删除这条日记吗？")) return; await apiJson("/api/admin/diary/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: diaryCurrent }) }); resetDiary(); await loadDiary(); setStatus("日记已删除"); }
    function renderProjectList() { const statusLabels = { completed: "已完成", "in-progress": "进行中", planned: "计划中" }; $("project-list").innerHTML = projectItems.length ? sortedItems(projectItems, "project").map((item) => `<button class="module-row ${item.id === projectCurrent ? "active" : ""}" data-id="${escapeHtml(item.id)}"><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(listDate(item))} · ${escapeHtml(statusLabels[item.status] || item.status || "")}</small></button>`).join("") : '<div class="empty">暂无项目</div>'; document.querySelectorAll("#project-list .module-row").forEach((el) => el.onclick = () => loadProjectItem(el.dataset.id)); }
    function resetProject() { projectCurrent = null; ["project-id", "project-title", "project-description", "project-tech", "project-tags", "project-image", "project-visit", "project-source", "project-end"].forEach((id) => $(id).value = ""); $("project-category").value = "web"; $("project-status").value = "planned"; $("project-start").value = today; $("project-featured").checked = false; $("project-delete").disabled = true; renderProjectList(); }
    function loadProjectItem(id) { const item = projectItems.find((entry) => entry.id === id); if (!item) return; projectCurrent = id; $("project-id").value = item.id; $("project-title").value = item.title || ""; $("project-description").value = item.description || ""; $("project-category").value = item.category || "other"; $("project-status").value = item.status || "planned"; $("project-start").value = dateValue(item.startDate); $("project-end").value = dateValue(item.endDate); $("project-tech").value = (item.techStack || []).join(", "); $("project-tags").value = (item.tags || []).join(", "); $("project-image").value = item.image || ""; $("project-visit").value = item.visitUrl || ""; $("project-source").value = item.sourceCode || ""; $("project-featured").checked = item.featured === true; $("project-delete").disabled = false; renderProjectList(); }
    async function loadProjects() { projectItems = (await apiJson("/api/admin/projects/")).items; renderProjectList(); if (projectCurrent === null) resetProject(); }
    async function saveProject() { const item = { id: $("project-id").value.trim(), title: $("project-title").value.trim(), description: $("project-description").value.trim(), category: $("project-category").value, status: $("project-status").value, startDate: $("project-start").value, endDate: $("project-end").value || undefined, techStack: $("project-tech").value.split(",").map((v) => v.trim()).filter(Boolean), tags: $("project-tags").value.split(",").map((v) => v.trim()).filter(Boolean), image: $("project-image").value.trim(), visitUrl: $("project-visit").value.trim(), sourceCode: $("project-source").value.trim(), featured: $("project-featured").checked, showImage: true }; await apiJson("/api/admin/projects/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ item }) }); await loadProjects(); projectCurrent = item.id; loadProjectItem(item.id); setStatus("项目已保存"); }
    async function uploadProjectImage() { const file = $("project-upload")?.files?.[0]; if (!file) return; const result = await uploadToCloudinary(file); $("project-image").value = result.secure_url; $("project-upload").value = ""; setStatus("项目图片上传成功"); }
    async function deleteProject() { if (!projectCurrent || !confirm("确定删除这个项目吗？")) return; await apiJson("/api/admin/projects/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: projectCurrent }) }); resetProject(); await loadProjects(); setStatus("项目已删除"); }
    function renderAlbumList() { $("album-list").innerHTML = albumItems.length ? sortedItems(albumItems, "album").map((item) => `<button class="module-row ${item.id === albumCurrent ? "active" : ""}" data-id="${escapeHtml(item.id)}"><strong>${escapeHtml(item.title || item.id)}</strong><small>${escapeHtml(listDate(item))} · ${item.mode === "external" ? (item.photos || []).length : item.imageCount || 0} 张照片</small></button>`).join("") : '<div class="empty">暂无相册</div>'; document.querySelectorAll("#album-list .module-row").forEach((el) => el.onclick = () => loadAlbumItem(el.dataset.id)); }
    function resetAlbum() { albumCurrent = null; ["album-id", "album-title", "album-description", "album-location", "album-tags", "album-cover", "album-password", "album-password-hint", "album-photos"].forEach((id) => $(id).value = ""); $("album-date").value = today; $("album-external").checked = false; $("album-hidden").checked = false; $("album-delete").disabled = true; renderAlbumList(); }
    function renderAlbumImages(images = []) { $("album-images").innerHTML = images.length ? images.map((image) => `<div class="album-image"><img src="${escapeHtml(image.url)}" alt="${escapeHtml(image.name)}"><div class="album-image-actions">${image.cover ? '<button type="button" disabled>封面</button>' : `<button type="button" data-cover="${escapeHtml(image.name)}">设为封面</button>`}<button type="button" class="delete-image" data-delete="${escapeHtml(image.name)}">删除</button></div></div>`).join("") : '<small class="save-note">该相册暂无本地图片。</small>'; document.querySelectorAll("[data-cover]").forEach((el) => el.onclick = () => setAlbumCover(el.dataset.cover)); document.querySelectorAll("[data-delete]").forEach((el) => el.onclick = () => deleteAlbumImage(el.dataset.delete)); }
    function loadAlbumItem(id) { const item = albumItems.find((entry) => entry.id === id); if (!item) return; albumCurrent = id; $("album-id").value = item.id; $("album-title").value = item.title || ""; $("album-description").value = item.description || ""; $("album-date").value = dateValue(item.date); $("album-location").value = item.location || ""; $("album-tags").value = (item.tags || []).join(", "); $("album-cover").value = item.cover || ""; $("album-password").value = item.password || ""; $("album-password-hint").value = item.passwordHint || ""; $("album-external").checked = item.mode === "external"; $("album-hidden").checked = item.hidden === true; $("album-photos").value = item.photos ? JSON.stringify(item.photos, null, 2) : ""; $("album-delete").disabled = false; renderAlbumImages(item.images || []); renderAlbumList(); }
    async function setAlbumCover(name) { const id = $("album-id").value.trim(); const image = (albumCurrent && albumItems.find((entry) => entry.id === albumCurrent)?.images || []).find((entry) => entry.name === name); if (!id || !image) return; await apiJson("/api/admin/album-image/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ albumId: id, name: image.name, id: image.id, publicId: image.publicId, url: image.url, cover: true }) }); await loadAlbums(); albumCurrent = id; loadAlbumItem(id); setStatus("封面已更新"); }
    async function deleteAlbumImage(name) { const id = $("album-id").value.trim(); if (!id || !confirm(`确定删除图片 ${name} 吗？`)) return; await apiJson("/api/admin/album-image/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ albumId: id, name }) }); await loadAlbums(); albumCurrent = id; loadAlbumItem(id); setStatus("图片已删除"); }
    async function loadAlbums() { albumItems = (await apiJson("/api/admin/albums/")).items; renderAlbumList(); if (albumCurrent === null) resetAlbum(); }
    async function saveAlbum() { const external = $("album-external").checked; let photos = []; if (external && $("album-photos").value.trim()) { try { photos = JSON.parse($("album-photos").value); } catch { return setStatus("外链照片 JSON 格式错误", true); } } const item = { id: $("album-id").value.trim(), title: $("album-title").value.trim(), description: $("album-description").value, date: $("album-date").value, location: $("album-location").value, tags: $("album-tags").value.split(",").map((v) => v.trim()).filter(Boolean), cover: $("album-cover").value.trim(), password: $("album-password").value, passwordHint: $("album-password-hint").value, hidden: $("album-hidden").checked, mode: external ? "external" : "local", photos }; await apiJson("/api/admin/albums/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ item }) }); await loadAlbums(); albumCurrent = item.id; loadAlbumItem(item.id); setStatus("相册已保存"); }
    async function uploadAlbumImages() { const id = $("album-id").value.trim(); const files = [...$("album-upload").files]; if (!id || !files.length) return; for (const file of files) { const result = await uploadToCloudinary(file); await apiJson("/api/admin/album-image/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ albumId: id, name: result.original_filename || file.name, publicId: result.public_id, deleteToken: result.delete_token, url: result.secure_url }) }); } $("album-upload").value = ""; await loadAlbums(); albumCurrent = id; loadAlbumItem(id); setStatus(`已上传 ${files.length} 张照片`); }
    async function deleteAlbum() { if (!albumCurrent || !confirm("确定删除这个相册及其照片吗？")) return; await apiJson("/api/admin/albums/", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: albumCurrent }) }); resetAlbum(); await loadAlbums(); setStatus("相册已删除"); }
    document.querySelectorAll(".nav-item[data-module]").forEach((item) => item.onclick = () => switchModule(item.dataset.module)); $("diary-upload")?.addEventListener("change", () => uploadDiaryImages().catch((error) => setStatus(error.message, true))); $("project-upload")?.addEventListener("change", () => uploadProjectImage().catch((error) => setStatus(error.message, true))); $("diary-new").onclick = resetDiary; $("diary-save").onclick = () => saveDiary().catch((error) => setStatus(error.message, true)); $("diary-delete").onclick = () => deleteDiary().catch((error) => setStatus(error.message, true)); $("project-new").onclick = resetProject; $("project-save").onclick = () => saveProject().catch((error) => setStatus(error.message, true)); $("project-delete").onclick = () => deleteProject().catch((error) => setStatus(error.message, true)); $("album-new").onclick = resetAlbum; $("album-save").onclick = () => saveAlbum().then(uploadAlbumImages).catch((error) => setStatus(error.message, true)); $("album-delete").onclick = () => deleteAlbum().catch((error) => setStatus(error.message, true));
    for (const [name, render] of [["post", renderList], ["diary", renderDiaryList], ["project", renderProjectList], ["album", renderAlbumList]]) {
      $(name + "-sort").addEventListener("change", render);
      $(name + "-sort").title = "按修改时间排序；没有修改时间时使用发布时间，项目使用开始日期";
    }
    $("new-post").onclick = resetForm; $("filter").oninput = renderList; $("save").onclick = () => savePost().catch((error) => setStatus(error.message, true)); $("delete").onclick = () => deletePost().catch((error) => setStatus(error.message, true)); $("encrypted").onchange = updateEncryptionFields; $("toggle-password").onclick = () => { const show = $("password").type === "password"; $("password").type = show ? "text" : "password"; $("toggle-password").innerHTML = `<i data-lucide="${show ? "eye-off" : "eye"}"></i>`; lucide.createIcons(); }; checkOnlineSession().then((authenticated) => { if (authenticated) { resetForm(); loadPosts().catch((error) => setStatus(error.message, true)); } });
  </script>
